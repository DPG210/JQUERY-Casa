    <main role="main" class="container">
      <h1>Hospitales</h1>
      <table id="tablaHospitales" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Direccion</th>
                <th>Telefono</th>
                <th>Camas</th>
            </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        let url="https://apicrudhospital.azurewebsites.net/";
        let param= new window.URLSearchParams(window.location.search);
        let iddelete=param.get("iddelete");

        console.log("mi iddelete es "+iddelete);

        if(iddelete!=null){
            var requestdel="webresources/hospitales/delete/"+iddelete;

            $.ajax({
                url:url+requestdel,
                type:"DELETE",
                success:function(){
                    console.log("Eliminando...")
                    loadHospitales();
                }
            })
        }
        

        $(document).ready(function(){
            loadHospitales();
        })
        
        function loadHospitales(){
            console.log("Dentro de loasHospitales");
            var request="webresources/hospitales";

            $.ajax({
                url:url+request,
                type:"GET",
                dataType:"json",
                success:function(data){
                    console.log("Dentro del get hospital");
                    console.log(data);
                    var html="";
                    $.each(data,function(index,hospital){
                        html+="<tr>";
                        html+="<td>"+hospital.idhospital+"</td>";
                        html+="<td>"+hospital.nombre+"</td>";
                        html+="<td>"+hospital.direccion+"</td>";
                        html+="<td>"+hospital.telefono+"</td>";
                        html+="<td>"+hospital.camas+"</td>";
                          html+="<td>"
                            html+="<a href='Practicajsonexamendetalle.html?idhospital="+hospital.idhospital+"'>Detalles</a>";
                        html+="</td>";
                        html+="<td>"
                            html+="<a href='Practicajsonexamenmodificar.html?idhospital="+hospital.idhospital+"'>Modificar</a>";
                        html+="</td>";
                        html+="<td>"
                            html+="<a href='Practicajsonexamenhome.html?iddelete="+hospital.idhospital+"'>Eliminar</a>";
                        html+="</td>";
                        html+="</tr>";
                    })
                    $("#tablaHospitales tbody").html(html);
                }
            })
        }
    </script>

    <!-- Bootstrap core JavaScript
    ================================================== -->
