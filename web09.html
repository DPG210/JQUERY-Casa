<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Generar checkbox</h1>
    <input type="range" id="rango" min="1" max="30" value="1">
    <span id="valorrango"></span>
    <h1 id="resultado">0</h1>
    <hr/>
    <div id="contenedor"></div>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            $("#rango").change(function(){
                var rango=parseInt($("#rango").val());
                $("#valorrango").text(rango);

                for(var i=0;i<=rango;i++){
                    var numAleatorio=parseInt(Math.random()*100+1);
                    var checkbox=$("<input>");
                        checkbox.attr("type","checkbox");
                        checkbox.val(numAleatorio);
                    $("#contenedor").append(checkbox);
                    var label=$("<label>",{
                    "text": numAleatorio
                    })
                    $("#contenedor").append(label);

                    checkbox.change(function(){
                    console.log("entre al cambio del checkbox");
                    var resultado=parseInt($("#resultado").text());
                    var numero=parseInt($(this).val());
                    console.log("este es mi numero "+numero);

                    if($(this).is(":checked")==true){
                        console.log("entre al if");
                        resultado+=numero;
                    }else{
                        resultado-=numero;
                    }

                    $("#resultado").text(resultado);
                })
                
                }

                
            })
        })
    </script>
</body>
</html>
