<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sumar numero</h1>
    <label for="">Numero</label>
    <input type="number" id="numero1">
    <input type="number" id="numero2">
    <button id="botonsumar">Calcular</button>
    <h1 id="suma"></h1>
    <hr/>
    <h1>Tabla de multiplicar</h1>
    <button id="botonmultiplicar" style="margin-bottom: 10px;">Multiplicar</button>
    <table id="tablamultiplicar" style="border: solid black 1px; text-align: center;">
        <thead>
        <tr>
            <th>Multiplicacion</th>
            <th></th>
            <th>Resultado</th>
        </tr>
        </thead>
        <tbody ></tbody>
    </table>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            
            $("#botonsumar").click(function(){
                var sumar;
                var num1=parseInt($("#numero1").val());
                var num2=parseInt($("#numero2").val());
                sumar= num1 + num2;
                $("#suma").text("La suma es: "+sumar);
            })
        })
            $("#botonmultiplicar").click(function(){
                var html="";
                var resultado;
                var sumar;
                var num1=parseInt($("#numero1").val());
                var num2=parseInt($("#numero2").val());
                sumar= num1 + num2;
                for(var i=0;i<=10;i++){
                    resultado= sumar *i;
                    html+="<tr>"
                    html+="<td> " +sumar + "*"+ i;
                    html+="<td>"+" = "+"</td>";
                    html+="<td> " +resultado;
                    html+="</tr>"
                }
                $("#tablamultiplicar tbody").html(html);
                $("#botonmultiplicar").css("color","fuchsia");
            })
    </script>
</body>
</html>
