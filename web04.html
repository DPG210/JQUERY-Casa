<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="">Introduzca rango de creacion</label>
    <input type="range" id="rango" min="1" max="20" value="1">
    <span id="valorrango"></span>
    <div id="contenedor"></div>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
           $("#rango").change(function(){
            
            var rango=parseInt($("#rango").val());
            console.log("este es mi rango"+rango);
            
            $("#valorrango").text(rango);

            var salto=$("<br>");

            var mensaje=$("<h1>");
                mensaje.css("color","blue");

            var suma=0;

            
            for(var i=1;i<=rango;i++){
                var boton= $("<button>");
                boton.text(Math.floor(Math.random()*100));
                $("#contenedor").append(boton);

                $(boton).click(function(){
                    suma+=parseInt($(this).text());

                    mensaje.text("La suma es "+ suma);
                })

                
            }

            $("#contenedor").append(salto);
            $("#contenedor").append(mensaje);
            
           })
            
            
            
            
        })
    </script>
</body>
</html>
