<body class="d-flex h-100 text-center text-white bg-dark">

        <main class="px-3">
            <h1>DOCTORES</h1>
            <table id="tabladoctores">
                <thead>
                    <tr>
                        <th>IdDoctor</th>
                        <th>IdHospital</th>
                        <th>Apellido</th>
                        <th>Especialidad</th>
                        <th>Salario</th>
                        <th></th>
                        <th></th>
                    </tr>

        <script src="js/jquery-3.7.1.js"></script>
        <script>
            var url="https://apicruddoctores.azurewebsites.net/"
            let params=new window.URLSearchParams(window.location.search);
            let iddelete=params.get("iddelete");

            if(iddelete!=null){
                var requestdel="api/Doctores/"+iddelete;

                $.ajax({
                    url:url+requestdel,
                    type:"DELETE",
                    success:function(){
                        console.log("Eliminando...");
                        loadDoctores();
                    }
                })
                
            }
            $(document).ready(function(){
                loadDoctores();
            })

            function loadDoctores(){
                var request="api/Doctores";
                

                $.ajax({
                    url:url+request,
                    type:"GET",
                    dataType:"json",
                    success:function(data){
                        console.log("Entrando en doctores");
                        console.log(data);

                        var html="";
                        $.each(data,function(index,doctor){
                            html+="<tr>";
                            html+="<td>"+doctor.idDoctor+"</td>";
                            html+="<td>"+doctor.idHospital+"</td>";
                            html+="<td>"+doctor.apellido+"</td>";
                            html+="<td>"+doctor.especialidad+"</td>";
                            html+="<td>"+doctor.salario+"</td>";
                            html+="<td>";
                            html+="<a href='web19practicachange.html?iddoctor="+doctor.idDoctor+"'>Cambiar"+"</a>";
                            html+="</td>";
                            html+="<td>";
                            html+="<a href='web19practicahome.html?iddelete="+doctor.idDoctor+"'>Borrar"+"</a>";
                            html+="</td>";
                            html+="</tr>";
                        })
                        $("#tabladoctores tbody").html(html);
                    }
                })
            }
        </script>
