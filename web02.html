<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Escriba los numeros</h1>
    <label for="">Numero 1</label>
    <input type="number" id="numero1">
    <label for="">Numero 2</label>
    <input type="number" id="numero2">
    <label for="">Numero 3</label>
    <input type="number" id="numero3">
    <button id="botoncalcular">Calcular</button>
    <div id="contenedor" style="margin-top: 10px;"></div>

    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            $("#botoncalcular").click(function(){
                var num1=parseInt($("#numero1").val());
                var num2=parseInt($("#numero2").val());
                var num3=parseInt($("#numero3").val());

                var mayor;
                var medio;
                var menor;

                var html="";

                var comparativa1="El mayor es  ";

                var comparativa2=" , el del medio es  ";

                var comparativa3=" , el menor es  ";
              

                if(num1>=num2 && num1>=num3){
                    mayor=num1;
                }else if(num2>=num1 && num2>=num3){
                    mayor=num2;
                }else{
                    mayor=num3;
                }

                if(num1<=num2 && num1<=num3){
                    menor=num1;
                }else if(num2<=num1 && num2<=num3){
                    menor=num2;
                }else{
                    menor=num3;
                }

                var resultado= num1 + num2 + num3;

                medio= resultado - mayor -menor;

                 html= comparativa1 + mayor + comparativa2 + medio + comparativa3 + menor;

                if(mayor==medio && mayor==menor){

                    console.log("entro en el primer if");

                    html="Todos los numeros son iguales, es el " + mayor;

                }else if(mayor==medio){

                    console.log("entro en el segundo if");

                    comparativa2=" , el del medio es igual que el mayor ";

                    html= comparativa1 + mayor + comparativa2 + comparativa3 + menor;

                } else if(medio==menor){

                    console.log("entro en el tercer if");

                    comparativa3=" , el menor es igual que el del medio ";

                    html= comparativa1 + mayor + comparativa2 +medio+ comparativa3 ;
                    
                } 
              
                $("#contenedor").html("<h1>" +html+"</h1>");

            })
        })
    </script>
</body>
</html>
