<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Clientes XML</h1>
    <div id="contenedorbotones"></div>
    </hr>
    <div id="contenedordatos"></div>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            let url="https://apiclientesxml.azurewebsites.net/"
            let request="api/Clientes"
            $.get(url+request,function(data){
                $(data).find("Cliente").each(function(){
                    var id= $(this).find("IdCliente").text();
                    var nombre= $(this).find("Nombre").text();

                    var boton=$("<button>", {
                        "text":nombre,
                        "value":id,
                        "class":"botones"
                    });
                    $("#contenedorbotones").append(boton);
                    
                })
                $(".botones").click(function(){
                var idboton=$(this).val();
                console.log("mi id de boton es "+idboton);
                let request2="api/Clientes/"+idboton;
                $.get(url+request2,function(data){
                    console.log("Entramos al segundo get");
                    var id=$(data).find("IdCliente").text();
                    var nombre=$(data).find("Nombre").text();
                    var email=$(data).find("Email").text();
                    var pagweb=$(data).find("PaginaWeb").text();
                    var imagen=$(data).find("Imagen").text();

                    var html="";

                    html="<h1>"+id+"<br>"+nombre+"<br>"+email+"<br>"+pagweb+"<br>";
                    html+="<img src='"+imagen+"' style='width:300px'>";

                    $("#contenedordatos").html(html);
                })
            })
            })
            
        })
    </script>
</body>
</html>
