        <main class="px-3">
            <h1>DOCTORES</h1>
           <table id="tabladoctores">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Hospital</th>
                        <th>Apellido</th>
                        <th>Especialidad</th>
                        <th>Salario</th>
                        <th>Detalles</th>
                        <th>Modificar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody></tbody>
           </table>
            
        </main>
        <script src="js/jquery-3.7.1.js"></script>
        <script>
            var url="https://apicruddoctores.azurewebsites.net/"
            let params=new window.URLSearchParams(window.location.search);
            var idDelete=params.get("iddoctor");
            console.log("Mi id es "+idDelete);

            if(idDelete!=null){
                var request="api/Doctores/"+idDelete;

                $.ajax({
                    url:url+request,
                    type:"DELETE",
                    success:function(){
                        console.log("Eliminado");
                        loadDoctores();
                    }
                })
            }

            $(document).ready(function(){
                loadDoctores();
            })

            function loadDoctores(){
                var request="/api/Doctores";

                $.ajax({
                    url:url+request,
                    type:"GET",
                    dataType:"json",
                    success:function(data){
                        console.log("Entrando en doctores...");
                        console.log(data);
                        var tabla="";
                        $.each(data,function(index,doctor){
                            tabla+="<tr>";
                            tabla+="<td>"+doctor.idDoctor+"</td>";
                            tabla+="<td>"+doctor.idHospital+"</td>";
                            tabla+="<td>"+doctor.apellido+"</td>";
                            tabla+="<td>"+doctor.especialidad+"</td>";
                            tabla+="<td>"+doctor.salario+" €"+"</td>";
                            tabla+="<td>";
                            tabla+="<a href='web20detallesdoctor.html?iddoctor="+doctor.idDoctor+"'>Detalles"+"</a>";
                            tabla+="</td>";
                            tabla+="<td>";
                            tabla+="<a href='web20modificardoctor.html?iddoctor="+doctor.idDoctor+"'>Modificar"+"</a>";
                            tabla+="</td>";
                            tabla+="<td>";
                            tabla+="<a href='web20home.html?iddoctor="+doctor.idDoctor+"'>Eliminar"+"</a>";
                            tabla+="</td>";
                            tabla+="</tr>";
                        })
                        $("#tabladoctores tbody").html(tabla);
                    }
                })
            }
        </script>
