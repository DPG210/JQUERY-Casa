<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Empleados y oficios</h1>
    <label for="">Seleccione el oficio</label>
    <select name="" id="selectoficio"></select><br>
    <label for="">Incremento Salarial</label>
    <input type="text" id="cajaincremento"><br>
    <button id="botonincrementar">Incrementar</button><br>
    <table id="tablaempleados">
        <thead>
            <tr>
                <th>Apellido</th>
                <th>Oficio</th>
                <th>Salario</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
         var url = "https://apiempleadosaction.azurewebsites.net/";
        $(document).ready(function(){
            loadDepartamentos();
            $("#selectoficio").change(function(){
                var oficios=$("#selectoficio").val();
                console.log("Este es mi oficio "+oficios);
                loadEmpleados(oficios);
            })
            $("#botonincrementar").click(function(){
                var oficios=$("#selectoficio").val();
                var incremento=parseInt($("#cajaincremento").val());
                var requesinc="api/Empleados/IncrementarSalarioOficios/"+oficios+"/"+incremento;
                $.ajax({
                    url:url+requesinc,
                    type:"PUT",
                    contentType:"application/json",
                    success:function(){
                        console.log("Incrementando");
                        loadEmpleados(oficios);
                    }
                })
            })
            
            
        })

        function loadDepartamentos(){
            var request="/api/Empleados/GetOficios/oficios";

            $.ajax({
                url:url+request,
                type:"GET",
                dataType:"json",
                success:function(data){
                    console.log("Entrando");
                    console.log(data);

                    $.each(data, function(index,oficio){
                        console.log(oficio);
                        var option=$("<option>");
                            option.text(oficio);
                            option.val(oficio);

                        $("#selectoficio").append(option);
                    })
                }
            })
        }

        function loadEmpleados(oficio){
            var request="/api/Empleados/GetEmpleadosOficio/empleadosoficio/"+oficio;

            $.ajax({
                url:url+request,
                type:"GET",
                dataType:"json",
                success:function(data){
                    console.log("Entrando a empleados");
                    var html="";
                    console.log(data);
                    $.each(data,function(index,empleado){
                        html+="<tr>";
                        html+="<td>"+empleado.apellido+"</td>";
                        html+="<td>"+empleado.oficio+"</td>";
                        html+="<td>"+empleado.salario+"</td>";
                        html+="</tr>";
                    })
                    $("#tablaempleados tbody").html(html);
                }
            })
        }
    </script>
</body>
</html>
