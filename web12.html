<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Buscar por id</h1>
    <input type="text" id="cajaid">
    <button id="botonid">Buscar</button>
    <h1 id="mensaje"></h1>
    </hr>
    <h1>Buscar por localidad</h1>
    <input type="text" id="cajalocalidad">
    <button id="botonlocalidad">Buscar</button>
    <ul id="listaempresas"></ul>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            $("#botonid").click(function(){
                $.get("documents/departamentos.xml",function(data){
                    var id=$("#cajaid").val();
                    var filtro= "DEPT[DEPT_NO="+id+"]";
                    var numdept=$(data).find(filtro);

                    var nombre=$(numdept).find("DNOMBRE").text();
                    var localidad=$(numdept).find("LOC").text();

                    $("#mensaje").text("Nombre "+nombre+" , departamento "+id+", localidad "+localidad);
                })
            })
            $("#botonlocalidad").click(function(){
                $.get("documents/departamentos.xml",function(data){
                    console.log("entramos a la consulta");
                    var localidad=$("#cajalocalidad").val();
                    var filtro="LOC:contains("+localidad+")";

                    var elementos=$(data).find(filtro);
                    var html="";

                    if(elementos.length<=0){
                        console.log("primer condicional de la consulta");
                        html="No hay coincidencias";
                    }else{
                        console.log("dentro de la consulta");
                        $(data).find(filtro).each(function(){
            
                            var nombre=$(this).parent().find("DNOMBRE").text();
                            var numdept=$(this).parent().attr("DEPT_NO");

                            html+="<li>"
                            html+= "Nombre: "+nombre;
                            html+=" Localidad "+ localidad;
                            html+=" Numero de departamento: "+numdept;
                            html+="</li>";
                        })
                    
                    }
                    $("#listaempresas").html(html);
                })
            })
        })
    </script>
</body>
</html>
