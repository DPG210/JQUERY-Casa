<body class="d-flex h-100 text-center text-white bg-dark">

        <main class="px-3">
            <h1>NUEVO DOCTOR</h1>
            <label for="">Id Doctor</label>
            <input type="text" id="cajaiddoctor" class="form-control"><br>
            <label for="">Id Hospital</label>
            <input type="text" id="cajaidhospital" class="form-control"><br>
            <label for="">Apellido</label>
            <input type="text" id="cajaapellido" class="form-control"><br>
            <label for="">Especialidad</label>
            <input type="text" id="cajaespecialidad" class="form-control"><br>
            <label for="">Salario</label>
            <input type="text" id="cajasalario" class="form-control"><br>
            <button id="botoncrear" class="btn" style="background-color:greenyellow">Crear</button>
        </main>
        <script src="js/jquery-3.7.1.js"></script>
        <script>
            var url="https://apicruddoctores.azurewebsites.net/"
            $(document).ready(function(){
                $("#botoncrear").click(function(){
                    var request="/api/Doctores"

                    var iddoctor=parseInt($("#cajaiddoctor").val());
                    var idhospital=parseInt($("#cajaidhospital").val());
                    var apellido=$("#cajaapellido").val();
                    var especialidad=$("#cajaespecialidad").val();
                    var salario=parseInt($("#cajasalario").val());
                    
                    var doctor=new Object();
                        doctor.idDoctor=iddoctor;
                        doctor.idHospital=idhospital;
                        doctor.apellido=apellido;
                        doctor.especialidad=especialidad;
                        doctor.salario=salario;

                    var doctorJSON=JSON.stringify(doctor);

                    $.ajax({
                        url:url+request,
                        type:"POST",
                        contentType:"application/json",
                        data:doctorJSON,
                        success:function(){
                            console.log("Creando...");

                            window.location.href="web19practicahome.html";
                        }
                    })
                })
            })
        </script>
