<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Generar botones</h1>
    <input type="range" id="rango" min="1" max="50" value="1">
    <span id="numerorango"></span>
    <div id="contenedor"></div>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            $("#rango").change(function(){
                var rango=parseInt($("#rango").val())
                $("#numerorango").text(rango);
                var suma=0;

                var mensaje=$("<h1>");

                for(var i=0;i<=rango;i++){
                    var boton=$("<button>")
                        boton.text(Math.floor(Math.random()*100));
                    $("#contenedor").append(boton);

                    $(boton).click(function(){
                        suma+=parseInt($(this).text());

                        mensaje.text("La suma es " +suma);
                    })

                $("#contenedor").append(mensaje);
                }
            })
        })
    </script>
</body>
</html>
