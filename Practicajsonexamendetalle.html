  <body>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
      <a class="navbar-brand" href="#">Hospitales DPG</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">

        </form>
      </div>
    </nav>

    <main role="main" class="container">
      <h1>Hospitales</h1>
      <label for="">ID Hospital</label>
        <input type="text" id="cajaid" class="form-control"><br>
        <label for="">Nombre</label>
        <input type="text" id="cajanombre" class="form-control"><br>
        <label for="">Direccion</label>
        <input type="text" id="cajadireccion" class="form-control"><br>
        <label for="">Telefono</label>
        <input type="text" id="cajatelefono" class="form-control"><br>
        <label for="">Camas</label>
        <input type="text" id="cajacamas" class="form-control"><br>

        <button id="botonhome">Volver a Home</button>
    </main>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        let url="https://apicrudhospital.azurewebsites.net/";
        $(document).ready(function(){
            let param=new window.URLSearchParams(window.location.search);
            let idhosp=param.get("idhospital");

            loadHospital(idhosp);
            $("#botonhome").click(function(){
                window.location.href="Practicajsonexamenhome.html";
            })
        })
        function loadHospital(id){
            console.log("Dentro de loasHospitales");
            var request="webresources/hospitales/"+id;

            $.ajax({
                url:url+request,
                type:"GET",
                dataType:"json",
                success:function(data){
                    console.log("Dentro del get hospital");
                    console.log(data);
                    
                    
                        $("#cajaid").val(data.idhospital);
                        $("#cajanombre").val(data.nombre);
                        $("#cajadireccion").val(data.direccion);
                        $("#cajatelefono").val(data.telefono);
                        $("#cajacamas").val(data.camas);
                    
                    
                }
            })
        }
        
        
        
    </script>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    
    <script src="js/bootstrap.min.js"></script>
