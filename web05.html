<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Escriba el rango</h1><br>
    <label for="">El rango es</label>
    <input type="range" id="rango" min="1" max="50" value="1">
    <span id="valorrango"></span>
    <div id="contenedor"></div>
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        $(document).ready(function(){
            $("#rango").change(function(){
                var rango=parseInt($("#rango").val())

                $("#valorrango").text(rango);

                var mensaje= $("<h1>");

                var suma=0;

                    for(var i=0;i<=rango;i++){
                        var boton= $("<button>")
                        boton.text(Math.floor(Math.random()*100));
                        boton.css("background-color","green");
                        $("#contenedor").append(boton);

                        $(boton).click(function(){
                        suma+=parseInt($(this).text());
                        mensaje.text("La suma es " + suma);
                    })
                    }

                    $("#contenedor").append(mensaje);
            })

        })
    </script>
</body>
</html>
